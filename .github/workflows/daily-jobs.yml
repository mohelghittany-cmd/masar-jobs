name: Update jobs and publish Masar
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * *' # 08:17 Dubai (UTC+4), best-effort
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: masar-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect job listings from public sources
        run: python scripts/update_jobs.py
      - name: Prepare site
        run: |
          mkdir -p public/data
          cp index.html public/index.html
          cp data/daily_jobs.json public/data/daily_jobs.json
          touch public/.nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Publish site
        uses: actions/deploy-pages@v4
        id: deployment
